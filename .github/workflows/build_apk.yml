name: Build Android APK (Official TOML Flow)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Accept Android Licenses
        run: |
          yes | flutter doctor --android-licenses

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv sync --reinstall

      - name: Clean Build
        run: rm -rf build/ dist/

      # 📦 修改后的打包命令
      # 1. 指定 "src" 目录作为入口 (因为 main.py 在 src 里)
      # 2. 声明 Android 存储权限 (否则 App 无法读取视频)
      # 3. 强制包含 flet_video 和 flet_permission_handler
      - name: Build APK
        run: |
          uv run flet build apk src \
            --verbose \
            --project "Gonggong" \
            --description "阿尔兹海默症回忆疗法" \
            --permissions android.permission.READ_EXTERNAL_STORAGE \
            --permissions android.permission.WRITE_EXTERNAL_STORAGE \
            --permissions android.permission.MANAGE_EXTERNAL_STORAGE \
            --include-packages flet_video,flet_permission_handler
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-official
          path: "**/*.apk"