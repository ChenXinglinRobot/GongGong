name: Build Android APK (Official TOML Flow)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Accept Android Licenses
        run: |
          yes | flutter doctor --android-licenses

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv sync --reinstall

      - name: Clean Build
        run: rm -rf build/ dist/

      # 📦 修改后的打包命令
      # 1. 指定 "src" 目录作为入口 (因为 main.py 在 src 里)
      # 2. 声明 Android 存储权限 (否则 App 无法读取视频)
      # 3. 强制包含 flet_video 和 flet_permission_handler
      # 📦 修正后的打包命令 (根据官方文档调整)
      # 📦 修正后的打包命令 (严格遵循官方文档)
      # 1. 移除了不存在的 --include-packages (Flet 会自动打包依赖)
      # 2. 修正了安卓权限写法 (必须加 =true)
      # 📦 终极简化版打包命令
      # Flet 会自动从 pyproject.toml 读取依赖、权限、描述和元数据
      # 我们只需要指定入口目录 (src) 即可
      - name: Build APK
        run: |
          uv run flet build apk src --verbose
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-official
          path: "**/*.apk"