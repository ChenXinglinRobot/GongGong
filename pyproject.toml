[project]
name = "gonggong"
version = "0.1.0"
description = "为外公定制的阿尔茨海默病回忆疗法应用"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "GongGong Developer", email = "1641782731@qq.com" }
]
# 核心依赖 (Build 时会自动安装这些)
dependencies = [
    "flet==0.80.5",  # ✅ 安全：永远固定在这个好用的版本
    "flet-video==0.80.5",
    "flet-permission-handler==0.80.5",
    "flet-audio==0.80.5",
]

# --- Flet 配置核心部分 ---
[tool.flet]
org = "com.gonggong"             # 组织标识
product = "公公的留声机"           # 应用显示名称
company = "GongGong Family"      # 公司/团队名
copyright = "Copyright (C) 2026"
bundle_id = "com.gonggong.gonggong"  # 安卓/iOS应用唯一标识符（Windows/macOS会忽略）

# [tool.flet.app] 
# 注意：删除了 path = "src"，因为这应该由 'flet build apk src' 命令行参数控制
# ✅ 必须加回这一段！
# 这告诉 Flet: "配置文件虽然在根目录，但请去 src 目录找 main.py"
[tool.flet.app]
path = "src"

# --- 安卓打包专用配置 ---
[tool.flet.android]
split_per_abi = false  # false = 生成一个通用 APK (推荐用于测试)
# 安卓应用图标配置（根据Flet文档，icon_android.png会自动被识别）
bundle_id = "com.gonggong.gonggong"  # 安卓应用唯一标识符

# --- 开屏图片 ---
[tool.flet.splash]
color = "#F6F1DE"       # 浅色模式背景 (对应 --splash-color)
dark_color = "#F6F1DE"  # 深色模式背景 (对应 --splash-dark-color)

# --- 关键：安卓权限配置 ---
[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.READ_EXTERNAL_STORAGE" = true
"android.permission.WRITE_EXTERNAL_STORAGE" = true
"android.permission.MANAGE_EXTERNAL_STORAGE" = true  # 针对 Android 11+ 的核心权限

# --- Windows打包专用配置 ---
[tool.flet.windows]
# Windows应用图标配置（根据Flet文档，icon_windows.png会自动被识别并转换为.ico）
# 注意：Windows不需要bundle_id配置
